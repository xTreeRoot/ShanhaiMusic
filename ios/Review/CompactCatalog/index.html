<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>山海 iOS 页面核对</title><style>body{font:15px system-ui;margin:24px;background:#f3f4f6;color:#19202b}h1{font-size:24px}input{padding:12px;font:inherit;border:1px solid #bbb;border-radius:10px;width:min(90%,500px)}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;margin-top:20px}figure{margin:0;background:white;border-radius:12px;padding:12px;overflow:hidden}img{width:100%;height:520px;object-fit:contain;background:#eee}figcaption{padding-top:10px;line-height:1.5;overflow-wrap:anywhere}small{color:#687080}figure[hidden]{display:none}</style><h1>山海 iOS · 页面、操作与状态</h1><p>点击图片查看原尺寸，按编号反馈细节。账号、评论、歌曲与插件均为隔离演示数据；静音演示及“不支持视频”截图不代表真实媒体播放验收。</p><input id="search" placeholder="筛选：播放器、设置、插件、iPad…"><p id="count"></p><main><figure data-search="收藏夹-原生移除 iPad Pro 13-inch (M5)"><a href="images/001.png"><img loading="lazy" src="images/001.png" alt="收藏夹-原生移除"></a><figcaption><b>#001 收藏夹-原生移除</b><br>iPad Pro 13-inch (M5)<br><small>MBiOSUITests/testFavoriteFolderTerminologyAndNativeRemoval()</small></figcaption></figure><figure data-search="收藏夹-播放器添加入口 iPad Pro 13-inch (M5)"><a href="images/002.png"><img loading="lazy" src="images/002.png" alt="收藏夹-播放器添加入口"></a><figcaption><b>#002 收藏夹-播放器添加入口</b><br>iPad Pro 13-inch (M5)<br><small>MBiOSUITests/testFavoriteFolderTerminologyAndNativeRemoval()</small></figcaption></figure><figure data-search="收藏夹-顶部紧凑曲目列表 iPad Pro 13-inch (M5)"><a href="images/003.png"><img loading="lazy" src="images/003.png" alt="收藏夹-顶部紧凑曲目列表"></a><figcaption><b>#003 收藏夹-顶部紧凑曲目列表</b><br>iPad Pro 13-inch (M5)<br><small>MBiOSUITests/testFavoriteFolderTerminologyAndNativeRemoval()</small></figcaption></figure><figure data-search="收藏夹-原生移除 iPhone 18 Pro"><a href="images/004.png"><img loading="lazy" src="images/004.png" alt="收藏夹-原生移除"></a><figcaption><b>#004 收藏夹-原生移除</b><br>iPhone 18 Pro<br><small>MBiOSUITests/testFavoriteFolderTerminologyAndNativeRemoval()</small></figcaption></figure><figure data-search="收藏夹-播放器添加入口 iPhone 18 Pro"><a href="images/005.png"><img loading="lazy" src="images/005.png" alt="收藏夹-播放器添加入口"></a><figcaption><b>#005 收藏夹-播放器添加入口</b><br>iPhone 18 Pro<br><small>MBiOSUITests/testFavoriteFolderTerminologyAndNativeRemoval()</small></figcaption></figure><figure data-search="收藏夹-顶部紧凑曲目列表 iPhone 18 Pro"><a href="images/006.png"><img loading="lazy" src="images/006.png" alt="收藏夹-顶部紧凑曲目列表"></a><figcaption><b>#006 收藏夹-顶部紧凑曲目列表</b><br>iPhone 18 Pro<br><small>MBiOSUITests/testFavoriteFolderTerminologyAndNativeRemoval()</small></figcaption></figure></main><script>const input=document.querySelector('input'),cards=[...document.querySelectorAll('figure')];input.oninput=()=>{cards.forEach(c=>c.hidden=!c.dataset.search.toLowerCase().includes(input.value.toLowerCase()));document.querySelector('#count').textContent=cards.filter(c=>!c.hidden).length+' 张截图'};input.oninput();</script></html>
